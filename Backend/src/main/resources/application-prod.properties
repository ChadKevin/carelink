spring.application.name=medtech
# Render injects a PORT env var and expects the app to listen on it.
server.port=${PORT:8080}

# Database Configuration (Production)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Keep on `update` for the demo so a brand-new Postgres gets its tables created
# automatically on first boot. Switch back to `validate` once the schema is stable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
