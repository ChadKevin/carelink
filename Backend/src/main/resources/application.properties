spring.application.name=medtech
server.port=8080

# Database Configuration (Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/medtech_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hospital Near You — live OpenStreetMap (Overpass) integration
carelink.overpass.url=https://overpass-api.de/api/interpreter

# Optional Google Places API key. When set, the backend resolves "hospitals near
# me" against Google Places (accurate for ANY location) before falling back to
# OpenStreetMap. Enable the Places API in your Google Cloud project, then run:
#   CARELINK_GOOGLE_MAPS_API_KEY=AIza... .\mvnw.cmd spring-boot:run
carelink.google.maps.api-key=${CARELINK_GOOGLE_MAPS_API_KEY:}

