spring.application.name=medtech
# Render injects a PORT env var and expects the app to listen on it.
# Default to 8080 locally when PORT isn't set.
server.port=${PORT:8080}

# Database Configuration (Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/medtech_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hospital Near You — live OpenStreetMap (Overpass) integration
carelink.overpass.url=https://overpass-api.de/api/interpreter

# Optional Google Places API key. The key is read from (in order):
#   1. the CARELINK_GOOGLE_MAPS_API_KEY environment variable, or
#   2. the gitignored ./Backend/.env file (auto-loaded below; missing file = no error).
# Never hard-code the key here — this file is committed to git.
carelink.google.maps.api-key=${CARELINK_GOOGLE_MAPS_API_KEY:}

# Load the local, gitignored Backend/.env (KEY=value format) so the API key
# never has to live in version control. `optional:` means it's fine if the
# file doesn't exist (e.g. CI / other machines).
spring.config.import=optional:file:./.env[.properties]

