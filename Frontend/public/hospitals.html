<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carelink - Nearest Hospitals</title>
  

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {

      --primary: #0284c7;        
      --primary-hover: #0369a1; 
      --bg: #f0f9ff;           
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #475569;
      --accent: #0c4a6e;      
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }


    body { 
      background-color: var(--bg); 
      color: var(--text);
      background-image: radial-gradient(#bae6fd 2px, transparent 2px);
      background-size: 30px 30px;
    }

    header {
      background: var(--card-bg);
      padding: 1rem 2rem;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 { color: var(--primary); font-size: 1.8rem; font-weight: 800; }

    .hero-container {
      max-width: 1200px;
      margin: 2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 0 1rem;
      position: relative;
    }

    .decor-img {
      width: 140px;
      animation: float 3s ease-in-out infinite;
    }

    .decor-left {
      width: 130px;
      animation: float 4s ease-in-out infinite reverse;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    .hero-panel {
      text-align: center;
      background: var(--card-bg);
      padding: 2.5rem 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.1);
      border-top: 5px solid var(--primary);
      z-index: 2;
    }

    .hero-panel h2 { font-size: 2.2rem; color: var(--accent); margin-bottom: 0.5rem; }
    
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    button:hover { transform: translateY(-3px); background: var(--primary-hover); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4); }
    button:disabled { background: #94a3b8; transform: none; cursor: wait; box-shadow: none; }

    .map-wrapper {
      max-width: 1200px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
    }

    #map {
      height: 500px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      z-index: 1;
      border: 4px solid white;
    }

  
    .hospital-grid {
      display: none; 
      max-width: 1200px;
      margin: 0 auto 4rem;
      padding: 0 1rem;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 16px;
      border-left: 6px solid var(--primary);
      box-shadow: 0 4px 6px rgba(2, 132, 199, 0.05);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(2, 132, 199, 0.12); }
    .card h3 { color: var(--accent); margin-bottom: 0.5rem; font-size: 1.2rem; }
    .card p { color: var(--text-light); font-size: 0.9rem; margin-bottom: 1rem; }
    
    .distance-badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1rem;
      align-self: flex-start;
    }

    .btn-outline {
      display: block;
      text-align: center;
      text-decoration: none;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    
    .btn-outline:hover { background: var(--primary); color: white; }
    #status { margin-top: 1rem; font-weight: 600; color: #0369a1; }

    @media (max-width: 768px) {
      .hero-container { flex-direction: column; }
      .decor-img, .decor-left { display: none; }
      #map { height: 400px; }
    }
  </style>
</head>
<body>

  <header>
    <div style="font-size: 2rem; color: #0284c7;">⚕️</div>
    <h1>Carelink</h1>
  </header>

  <div class="hero-container">
  
    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966465.png" alt="Hospital Building" class="decor-left">
    
    <div class="hero-panel">
      <h2>Emergency or Checkup?</h2>
      <p style="color: var(--text-light); margin-bottom: 1rem;">Instantly locate the nearest medical facilities using real-time GPS.</p>
      <button id="locate-btn" onclick="initiateSearch()">📍 Find Hospitals Near Me</button>
      <div id="status"></div>
    </div>

   
    <img src="https://cdn-icons-png.flaticon.com/512/1032/1032989.png" alt="Ambulance" class="decor-img">
  </div>

  <div class="map-wrapper">
    <div id="map"></div>
  </div>

  <div class="hospital-grid" id="list-container">
   
  </div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('locate-btn');
    const listContainer = document.getElementById('list-container');
    let map;

    
    window.onload = () => {
      map = L.map('map').setView([20.5937, 78.9629], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
    };

    function initiateSearch() {
      btn.disabled = true;
      statusDiv.innerHTML = "⏳ Accessing secure location data...";
      
      if (!navigator.geolocation) {
        statusDiv.innerHTML = "❌ Geolocation is not supported by your browser.";
        btn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
  
          map.setView([lat, lon], 13);
          L.marker([lat, lon]).addTo(map).bindPopup("<b>📍 You are here</b>").openPopup();
          
          fetchOverpassData(lat, lon);
        },
        error => {
          btn.disabled = false;
          statusDiv.innerHTML = "❌ Location access denied. Please enable permissions.";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function fetchOverpassData(lat, lon) {
      statusDiv.innerHTML = "📡 Scanning grid for medical facilities...";
      
      const query = `
        [out:json][timeout:25];
        node["amenity"="hospital"](around:10000,${lat},${lon});
        out;
      `;
      const url = `https://lz4.overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Network response was not ok");
        const data = await response.json();
        
        if(data.elements.length === 0) {
            statusDiv.innerHTML = "⚠️ No hospitals found within a 10km radius.";
            btn.disabled = false;
            return;
        }

        let msg = `✅ Found ${data.elements.length} nearby hospitals!`;
        if (data.elements.length > 10) {
            msg += ` Showing the 10 closest.`;
        }
        statusDiv.innerHTML = msg;
        btn.disabled = false;
        
        processAndDisplay(data.elements, lat, lon);
      } catch (error) {
        console.error(error);
        statusDiv.innerHTML = "❌ Failed to fetch data. Check your internet or adblocker.";
        btn.disabled = false;
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(1);
    }

    function processAndDisplay(hospitals, userLat, userLon) {
      listContainer.style.display = 'grid';
      listContainer.innerHTML = "";

      const processed = hospitals.map(h => ({
        name: h.tags.name || "Unnamed Hospital/Clinic",
        lat: h.lat,
        lon: h.lon,
        distance: parseFloat(calculateDistance(userLat, userLon, h.lat, h.lon))
      })).sort((a, b) => a.distance - b.distance);

      const top10 = processed.slice(0, 10);

      top10.forEach(h => {
        L.marker([h.lat, h.lon]).addTo(map)
          .bindPopup(`<b>${h.name}</b><br>${h.distance} km away`);

        const mapsLink = `https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lon}`;
        listContainer.innerHTML += `
          <div class="card">
            <div>
              <h3>🏥 ${h.name}</h3>
              <div class="distance-badge">🚗 ${h.distance} km away</div>
            </div>
            <a href="${mapsLink}" target="_blank" class="btn-outline">🧭 Open in Google Maps</a>
          </div>
        `;
      });
      
      const bounds = L.latLngBounds(top10.map(h => [h.lat, h.lon]));
      bounds.extend([userLat, userLon]);
      map.fitBounds(bounds, { padding: [50, 50] });
    }
  </script>
</body>
</html>
